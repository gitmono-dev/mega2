services:
  postgres:
    image: postgres:15-alpine
    shm_size: "1gb"
    environment:
      POSTGRES_USER: monoengine
      POSTGRES_PASSWORD: monoengine_test_password
      POSTGRES_DB: monoengine
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monoengine -d monoengine"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Optional SMTP capture for the monoui front end's authentication/product-mail
  # IT only.
  # Monoengine does not connect to or depend on this service.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 2s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for IT smoke (RustFS). Public test credentials
  # are `rustfs` / `rustfs_secret` (see `.env.test.example`).
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs_secret
      # Single-volume local smoke; required when not using multi-disk topology.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Bucket initialization via `mc`. Stays up (sleep infinity) with a healthcheck
  # so default `up -d --wait` can wait on it — a pure one-shot exit breaks --wait.
  # Recreate this service (or `down` + `up`) after wiping rustfs if the bucket
  # disappears; `mb --ignore-existing` is idempotent on fresh starts.
  rustfs-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://rustfs:9000 rustfs rustfs_secret &&
      /usr/bin/mc mb --ignore-existing local/monoengine &&
      /usr/bin/mc anonymous set download local/monoengine &&
      /usr/bin/mc mb --ignore-existing local/monoui &&
      /usr/bin/mc anonymous set download local/monoui &&
      exec sleep infinity
      "
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/mc ls local/monoengine && /usr/bin/mc ls local/monoui"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Fixed-version Git CLI runner for cargo-native black-box tests (ADR-IT-01).
  # Joins networks.default and reaches per-case monoengine on the host via
  # host.docker.internal (extra_hosts below). Cross-platform on Linux and macOS
  # Docker Desktop; harness maps remote URLs accordingly.
  #
  # Prefer pre-creating the shared workdir as the test UID before `up`
  # (`mkdir -p … && chmod 1777 …`). If the path is missing, Docker's bind
  # auto-create may make it root:root and the unprivileged cargo process will
  # then hit EACCES allocating per-case subdirs — CI/startup scripts should
  # always mkdir first (IT-04 will wire this into workflows).
  #
  # Run as a fixed numeric UID/GID so Compose can resolve `user:` without
  # relying on Bash's unexported `$UID`. Default 1000:1000 matches common
  # CI runners (ubuntu-latest) and local desktop users; override with
  # `export MONOENGINE_IT_GIT_UID=$(id -u) MONOENGINE_IT_GIT_GID=$(id -g)`
  # when the test process is not 1000.
  git-cli:
    image: monoengine-git-cli:3.7.1
    build:
      context: .
      dockerfile: Dockerfile.git-cli
    # Opt-in profile: keeping git-cli off the default `up -d --wait` set avoids
    # pulling the runner into data-plane-only dev loops. Enable with
    # `--profile git` for integration_git_cli / cargo test --all IT gates.
    profiles: ["git"]
    # Reap orphaned git/ssh children from the docker-exec timeout wrapper
    # (setsid + kill). Without init, PID 1 is `sleep infinity` and zombies
    # accumulate until later SSH clones fail with protocol `error: …`.
    init: true
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${MONOENGINE_IT_GIT_UID:-1000}:${MONOENGINE_IT_GIT_GID:-1000}"
    volumes:
      - ${MONOENGINE_IT_GIT_WORKDIR:-/tmp/monoengine-git}:/work
    working_dir: /work
    # Override the image's `git` entrypoint so the container stays up for `exec`.
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "git --version >/dev/null && git lfs version | grep -q '^git-lfs/3[.]7[.]1 '"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Linked git protocol smoke runner (profile `smoke`).
  #
  # Unlike `git-cli` (bridge + host.docker.internal, for the cargo-native harness
  # that spawns its own service on the host), this service talks
  # to the compose-hosted `monoengine` over the internal bridge
  # (http://monoengine:8000/). It runs `scripts/git_protocol_smoke.sh` against
  # the linked stack: ls-remote / clone / fetch / push / tag-reject / LFS.
  #
  # It depends on `monoengine` (profile `app`) being up, so bring the whole
  # linked stack up together:
  #   docker compose -p monoengine-it -f docker-compose.test.yml \
  #     --profile app --profile smoke up -d --wait
  #
  # Then drive the smoke from the host:
  #   docker compose -p monoengine-it -f docker-compose.test.yml \
  #     --profile smoke exec -T git-smoke \
  #     bash scripts/git_protocol_smoke.sh
  # (with MONOENGINE_HTTP_REPO_URL=http://monoengine:8000/ and a seeded token).
  #
  # NOTE: git-smoke lives in its own `smoke` profile (not `git`) so that
  # `--profile git` invocations (git-cli + data plane) never activate it. Its
  # `depends_on: monoengine` (profile `app`) would otherwise make the compose
  # project invalid whenever the `git` profile is active but `app` is not
  # ("service git-smoke depends on undefined service monoengine").
  git-smoke:
    image: monoengine-git-smoke:3.7.1
    build:
      context: .
      dockerfile: Dockerfile.git-smoke
    profiles: ["smoke"]
    init: true
    depends_on:
      monoengine:
        condition: service_healthy
    environment:
      # Default repo URL points at the linked compose-hosted monoengine.
      MONOENGINE_HTTP_REPO_URL: http://monoengine:8000/
      # Optional SSH URL (monoengine SSH service, if enabled in the stack).
      # MONOENGINE_SSH_REPO_URL: ssh://git@monoengine:2222/
      # Push/tag/LFS smoke are opt-in via these flags.
      MONOENGINE_GIT_SMOKE_PUSH: "1"
      MONOENGINE_GIT_SMOKE_LFS: "0"
      # Seed token for receive-pack Basic Auth (overridden by the exec command).
      MONOENGINE_IT_SEED_TOKEN: monoengine-it-git-smoke-token-0001
    volumes:
      - ${MONOENGINE_IT_GIT_WORKDIR:-/tmp/monoengine-git}:/work
      # Mount the monoengine repo so the smoke script is available inside the
      # linked container (scripts/git_protocol_smoke.sh).
      - .:/repo:ro
    working_dir: /work
    healthcheck:
      test: ["CMD-SHELL", "git --version >/dev/null && git lfs version | grep -q '^git-lfs/3[.]7[.]1 '"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Standing monoengine HTTP service for stack-level IT (profile `app`).
  # Per-case cargo black-box tests still spawn via CARGO_BIN_EXE for isolation;
  # this service is the compose-hosted process under test for stack smoke.
  # Build context is the parent of `monoengine/` + `orbit/` (see Dockerfile).
  # CI may pre-tag `monoengine:local` from Dockerfile.it-runtime instead of
  # rebuilding from source (`pull_policy: never`).
  monoengine:
    profiles: ["app"]
    image: monoengine:local
    pull_policy: never
    build:
      context: ..
      dockerfile: monoengine/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MEGA_BASE_DIR: /var/lib/monoengine
      MEGA_CONFIG: /etc/monoengine/config.toml
      MEGA_DATABASE__DB_TYPE: postgres
      MEGA_DATABASE__DB_URL: postgres://monoengine:monoengine_test_password@postgres:5432/monoengine
      MEGA_REDIS__URL: redis://redis:6379
      # Keep the full documented IT CORS allowlist when overriding the sample
      # config, and add the monoui host origin for stack session tests.
      MEGA_OAUTH__ALLOWED_CORS_ORIGINS: http://local.gitmega.com,https://app.gitmega.com,http://app.gitmono.test,http://127.0.0.1:17001
      MEGA_OAUTH__WEBSITE_API_BASE_URL: http://website-next:7001
      # MN-05: shared IT-only credential for monoui's internal product-email API.
      MEGA_NOTIFICATION__WEBSITE_MAIL_BASE_URL: http://website-next:7001
      MEGA_NOTIFICATION__WEBSITE_MAIL_BEARER: monoengine-it-website-mail-bearer-0001
      MEGA_OBJECT_STORAGE__STORAGE_TYPE: local
      MEGA_OBJECT_STORAGE__LOCAL__ROOT_DIR: /var/lib/monoengine/objects
      MEGA_LOG__PRINT_STD: "true"
      MEGA_LOG__LEVEL: info
    volumes:
      - monoengine-data:/var/lib/monoengine
    ports:
      - "127.0.0.1:19180:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/openapi.json"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot PostgreSQL schema initialization for the monoui front end. Reuses
  # the monoui Dockerfile builder stage because the production runner is a
  # standalone Next image and deliberately has no Drizzle tooling.
  # Account data lives in an isolated `website` database on the shared
  # postgres service — never the monoengine business DB (ADR-WA-07).
  website-db-init:
    profiles: ["web"]
    build:
      context: ../monoui
      dockerfile: apps/next-app/Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DIALECT: pg
      DATABASE_URL: postgresql://monoengine:monoengine_test_password@postgres:5432/website
      # Connects to the maintenance DB only to CREATE DATABASE website.
      DATABASE_ADMIN_URL: postgresql://monoengine:monoengine_test_password@postgres:5432/postgres
    command:
      - /bin/sh
      - -ec
      - |
        node -e "
        const { Client } = require('pg');
        (async () => {
          const admin = new Client({ connectionString: process.env.DATABASE_ADMIN_URL });
          await admin.connect();
          const { rowCount } = await admin.query(
            \"SELECT 1 FROM pg_database WHERE datname = 'website'\"
          );
          if (rowCount === 0) {
            await admin.query('CREATE DATABASE website');
            console.log('created database website');
          } else {
            console.log('database website already exists');
          }
          await admin.end();
        })().catch((err) => {
          console.error(err);
          process.exit(1);
        });
        "
        npx drizzle-kit push --force

  # monoui Better Auth test instance. Uses isolated Postgres database
  # `website` on the shared postgres service (not monoengine's business DB).
  # Build locally from the sibling checkout; CI must check out ../monoui too.
  website-next:
    profiles: ["web"]
    image: website-next:local
    pull_policy: never
    build:
      context: ../monoui
      dockerfile: apps/next-app/Dockerfile
    environment:
      DB_DIALECT: pg
      DATABASE_URL: postgresql://monoengine:monoengine_test_password@postgres:5432/website
      APP_BASE_URL: http://127.0.0.1:17001
      BETTER_AUTH_URL: http://127.0.0.1:17001
      BETTER_AUTH_SECRET: monoengine-it-website-auth-secret-0001
      # Consumed by DEP-06's internal notification route. This public value is
      # only for the isolated Compose integration stack.
      MONOENGINE_INTERNAL_MAIL_BEARER: monoengine-it-website-mail-bearer-0001
      # WE-05/WE-06: IT product mail uses the in-memory test provider (no cloud).
      EMAIL_PROVIDER: test
      EMAIL_DEFAULT_FROM: noreply@monoengine-it.test
      # Optional CTA base for product templates (not TinyShip APP_BASE_URL).
      MONOENGINE_PUBLIC_BASE_URL: http://monoengine:8000
      # MC-07: route Code read paths through the monoengine BFF inside compose.
      MEGA_CODE_DATA_BACKEND: monoengine
      # FS-02: monoui uploads via RustFS S3 (monoui bucket)
      STORAGE_PROVIDER: s3
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: rustfs
      S3_ACCESS_KEY_SECRET: rustfs_secret
      S3_BUCKET: monoui
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_URL: http://127.0.0.1:19000/monoui
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      website-db-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_healthy
    ports:
      - "127.0.0.1:17001:7001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const socket = require('net').connect(7001, '127.0.0.1'); socket.setTimeout(1000); socket.on('connect', () => process.exit(0)); socket.on('error', () => process.exit(1)); socket.on('timeout', () => process.exit(1));\""]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  monoengine-data:

networks:
  default:
    name: monoengine-test-network
