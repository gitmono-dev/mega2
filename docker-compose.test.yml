services:
  postgres:
    image: postgres:15-alpine
    shm_size: "1gb"
    environment:
      POSTGRES_USER: monoengine
      POSTGRES_PASSWORD: monoengine_test_password
      POSTGRES_DB: monoengine
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monoengine -d monoengine"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Optional SMTP capture for website-next authentication/product-mail IT only.
  # Monoengine does not connect to or depend on this service.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 2s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for IT smoke (RustFS). Public test credentials
  # are `rustfs` / `rustfs_secret` (see `.env.test.example`).
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs_secret
      # Single-volume local smoke; required when not using multi-disk topology.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot bucket initialization via any S3 client (`mc`). Not part of the
  # default `up -d --wait` set because `--wait` requires selected services to
  # stay running/healthy; run explicitly with
  # `docker compose -p monoengine-it -f docker-compose.test.yml --profile init run --rm rustfs-init`.
  rustfs-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://rustfs:9000 rustfs rustfs_secret &&
      /usr/bin/mc mb --ignore-existing local/testbucket &&
      /usr/bin/mc anonymous set download local/testbucket
      "

  # Fixed-version Git CLI runner for cargo-native black-box tests (ADR-IT-01).
  # Uses host networking so the container can reach monoengine bound on the
  # host's 127.0.0.1 high ports; therefore it cannot join networks.default.
  #
  # Prefer pre-creating the shared workdir as the test UID before `up`
  # (`mkdir -p … && chmod 1777 …`). If the path is missing, Docker's bind
  # auto-create may make it root:root and the unprivileged cargo process will
  # then hit EACCES allocating per-case subdirs — CI/startup scripts should
  # always mkdir first (IT-04 will wire this into workflows).
  #
  # Run as a fixed numeric UID/GID so Compose can resolve `user:` without
  # relying on Bash's unexported `$UID`. Default 1000:1000 matches common
  # CI runners (ubuntu-latest) and local desktop users; override with
  # `export MONOENGINE_IT_GIT_UID=$(id -u) MONOENGINE_IT_GIT_GID=$(id -g)`
  # when the test process is not 1000.
  git-cli:
    image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
    # Opt-in profile: host networking is Linux-only (IT/prod target OS).
    # Keeping git-cli off the default `up -d --wait` set also avoids pulling
    # host networking into the data-plane stack on non-target Docker Desktop
    # machines. Enable with `--profile git` on Linux CI/local VER.
    profiles: ["git"]
    network_mode: host
    user: "${MONOENGINE_IT_GIT_UID:-1000}:${MONOENGINE_IT_GIT_GID:-1000}"
    volumes:
      - ${MONOENGINE_IT_GIT_WORKDIR:-/tmp/monoengine-git}:/work
    working_dir: /work
    # Override the image's `git` entrypoint so the container stays up for `exec`.
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "git", "--version"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Standing monoengine HTTP service for stack-level IT (profile `app`).
  # Per-case cargo black-box tests still spawn via CARGO_BIN_EXE for isolation;
  # this service is the compose-hosted process under test for stack smoke.
  # Build context is the parent of `monoengine/` + `orbit/` (see Dockerfile).
  # CI may pre-tag `monoengine:local` from Dockerfile.it-runtime instead of
  # rebuilding from source (`pull_policy: never`).
  monoengine:
    profiles: ["app"]
    image: monoengine:local
    pull_policy: never
    build:
      context: ..
      dockerfile: monoengine/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MEGA_BASE_DIR: /var/lib/monoengine
      MEGA_CONFIG: /etc/monoengine/config.toml
      MEGA_DATABASE__DB_TYPE: postgres
      MEGA_DATABASE__DB_URL: postgres://monoengine:monoengine_test_password@postgres:5432/monoengine
      MEGA_REDIS__URL: redis://redis:6379
      # Keep the full documented IT CORS allowlist when overriding the sample
      # config, and add the website-next host origin for stack session tests.
      MEGA_OAUTH__ALLOWED_CORS_ORIGINS: http://local.gitmega.com,https://app.gitmega.com,http://app.gitmono.test,http://127.0.0.1:17001
      MEGA_OAUTH__WEBSITE_API_BASE_URL: http://website-next:7001
      # MN-05: shared IT-only credential for website's internal product-email API.
      MEGA_NOTIFICATION__WEBSITE_MAIL_BASE_URL: http://website-next:7001
      MEGA_NOTIFICATION__WEBSITE_MAIL_BEARER: monoengine-it-website-mail-bearer-0001
      MEGA_OBJECT_STORAGE__STORAGE_TYPE: local
      MEGA_OBJECT_STORAGE__LOCAL__ROOT_DIR: /var/lib/monoengine/objects
      MEGA_LOG__PRINT_STD: "true"
      MEGA_LOG__LEVEL: info
    volumes:
      - monoengine-data:/var/lib/monoengine
    ports:
      - "127.0.0.1:19180:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/openapi.json"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot SQLite schema initialization for website-next. It reuses the
  # website Dockerfile builder stage because the production runner is a
  # standalone Next image and deliberately has no Drizzle tooling. The final
  # chown makes the initialized database writable by the runner's nextjs user.
  website-db-init:
    profiles: ["web"]
    build:
      context: ../website
      dockerfile: apps/next-app/Dockerfile
      target: builder
    environment:
      DB_DIALECT: sqlite
      SQLITE_DB_PATH: /app/data/website-it.sqlite
    volumes:
      - website-next-data:/app/data
    command:
      - /bin/sh
      - -ec
      - pnpm db:push:sqlite && chown -R 1001:1001 /app/data

  # Website Better Auth test instance. It intentionally uses its own SQLite
  # file rather than the monoengine PostgreSQL business database.
  # Build locally from the sibling checkout; CI must check out ../website too.
  website-next:
    profiles: ["web"]
    image: website-next:local
    pull_policy: never
    build:
      context: ../website
      dockerfile: apps/next-app/Dockerfile
    environment:
      DB_DIALECT: sqlite
      SQLITE_DB_PATH: /app/data/website-it.sqlite
      APP_BASE_URL: http://127.0.0.1:17001
      BETTER_AUTH_URL: http://127.0.0.1:17001
      BETTER_AUTH_SECRET: monoengine-it-website-auth-secret-0001
      # Consumed by DEP-06's internal notification route. This public value is
      # only for the isolated Compose integration stack.
      MONOENGINE_INTERNAL_MAIL_BEARER: monoengine-it-website-mail-bearer-0001
    depends_on:
      website-db-init:
        condition: service_completed_successfully
    volumes:
      - website-next-data:/app/data
    ports:
      - "127.0.0.1:17001:7001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const socket = require('net').connect(7001, '127.0.0.1'); socket.setTimeout(1000); socket.on('connect', () => process.exit(0)); socket.on('error', () => process.exit(1)); socket.on('timeout', () => process.exit(1));\""]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  monoengine-data:
  website-next-data:

networks:
  default:
    name: monoengine-test-net
