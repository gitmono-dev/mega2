[profile.default]
# One process per test already pays for a cloned database. Do not multiply
# that by more workers than the machine has CPUs; the shared Postgres is the
# limit, not the Rust scheduler.
test-threads = "num-cpus"
failure-output = "immediate"
status-level = "leak"
retries = 0

# Test groups bound how many tests share one external service at a time. A
# test belongs to the first override below whose filter matches it.
[test-groups]
# Library tests that clone a database from the `mega2_tpl` template. Kept at 4
# so the shared test Postgres and self-hosted runner do not hit 5s pool acquire
# timeouts while `git-cli` and `it-serial` boot full service instances.
pg = { max-threads = 4 }
# Integration binaries that drive the shared git-cli container. Concurrent
# clones from that container hang until the in-container timeout kills them,
# so these binaries run one test at a time across all of them.
git-cli = { max-threads = 1 }
# The remaining integration binaries (including RustFS-heavy media tests) plus
# the RustFS-heavy library tests, one at a time, as `docs/development.md` runs
# `integration_vault` (`--test-threads=1`). Sharing one serial lane keeps
# RustFS contention low without adding an extra concurrent Postgres worker.
it-serial = { max-threads = 1 }

[[profile.default.overrides]]
# Every `tests/*.rs` binary with a test that runs Git inside the git-cli
# container (`docker exec` beyond the `git --version` probe), measured with a
# `docker` shim. Add a binary here when its tests start cloning or pushing
# through `tests/common/git_cli.rs`.
filter = 'binary(/^integration_(git_cli|git_lfs|git_ssh|import_hash|native_hash|native_push_hash|traces)$/)'
test-group = 'git-cli'

[[profile.default.overrides]]
filter = 'kind(test) | (kind(lib) & test(/^jupiter::(storage::trace_object_storage::tests::raw_cross_process_rustfs_|service::trace_fetch_service::tests::)/))'
test-group = 'it-serial'

[[profile.default.overrides]]
# These parents re-run a database test in child processes (`db_cleanup_repro`
# starts 16 at once), so one of them takes the whole `pg` lane.
filter = 'kind(lib) & test(/^jupiter::tests::schema_guard_tests::(db_cleanup_repro|db_cleanup_parallel_parent|db_namespace_pid_reuse_parent)$/)'
test-group = 'pg'
threads-required = 4

[[profile.default.overrides]]
# Fail closed: every library test is capped unless its module was measured to
# open no PostgreSQL connection (PGAPPNAME-tagged nextest run, 1,395 of 2,846
# library tests connect). Only subtrees of 20 or more such tests are listed.
# Move a subtree out of this list when one of its tests starts using
# `test_db_connection`, `test_db_config`, `test_storage*` or another fixture
# from `src/jupiter/tests.rs`.
filter = '''
kind(lib) & !test(/^(api::router::lfs_router|ceres::api_service::mono_api_service::test|ceres::view|commands::config|common|config::(reload|test|validate)|contract::policy::guard::cedar_guard|jupiter::redis|jupiter::service::buck_service|orbit|orbit_api)::/)
'''
test-group = 'pg'
