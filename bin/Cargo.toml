[package]
name = "monoengine"
version = "0.1.121"
edition = "2024"

# The thin composition-root binary. It depends on `monoengine-core` (which only
# knows the `orbit-api` contract) plus the heavy `orbit` implementation crate,
# and is the single place that names `orbit::` to build object storage. The
# global allocators are a binary concern and live here. See
# `docs/refactoring/orbit.md`.

[[bin]]
name = "monoengine"
path = "src/main.rs"

[dependencies]
monoengine-core = { path = ".." }
orbit = { path = "../../orbit" }
orbit-api = { path = "../../orbit/api" }
async-trait = "0.1.89"

[target.'cfg(not(windows))'.dependencies]
jemallocator = "0.5.4"

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.52"

# Process-level black-box integration tests (bin/tests/integration_vault.rs)
# drive the real CLI via CARGO_BIN_EXE_monoengine and talk to the docker test
# PostgreSQL directly. See docs/refactoring/integration.md.
[dev-dependencies]
# `libc` is only used by the service-startup smoke test to deliver SIGINT for a
# graceful-shutdown assertion; it is already in the dependency tree via the core.
libc = "0.2"
sea-orm = { version = "1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde_json = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "net", "time"] }
url = "2.5.8"
